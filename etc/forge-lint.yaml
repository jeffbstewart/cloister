# forge-lint configuration for THIS repository (docs/grange.md R1-R8).
# Identities and expectations only — the credential rides the
# FORGE_LINT_TOKEN env var, never this file.  Every field is required.

forge: github
apiBase: https://api.github.com
repo: jeffbstewart/cloister
defaultBranch: main
operator: jeffbstewart            # the human whose approval satisfies R2
bot: jbstewart-agent              # write collaborator; must never be admin
requiredChecks: [verify]          # the presubmit suite (R3)
agentNamespace: agent/            # the bot's branch namespace (R8)
