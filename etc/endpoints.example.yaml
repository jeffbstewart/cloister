# The archivist's endpoint table (docs/archivist.md, "Endpoints,
# identity, and credential"): one entry per reachable git endpoint, all
# of them ONE human principal's bots.  Mounted read-only into the
# archivist; holds credential PATHS, never secrets.  The table is also
# the remote allowlist — a remote URL matching no entry's canonical or
# wire prefix is refused before git ever runs.
#
# Copy to endpoints.yaml, adjust, and mount beside one read-only token
# file per endpoint.  Every field is required; unknown keys are errors.

endpoints:
  - name: github.com          # also the relay's name and network alias
    canonical: https://github.com/
    wire: https://github.com/ # resolved to the relay by network alias
    forge: github
    api: https://api.github.com/
    apiRelay: github-api-relay:443   # the api relay's cell address (NOT aliased as api.github.com)
    credentialFile: /run/secrets/github-token
    bot:
      name: example-agent     # the bot account, never the human
      email: 000000+example-agent@users.noreply.github.com
