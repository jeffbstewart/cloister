# ── Per-project cell stack ──────────────────────────────────────────────────
# One coding agent, all its workers, and a set of networks that enforce the
# structural safety requirements. Deploy one cell per project; attach to the
# shared infra stack's `infernet` (docker/inference.yaml) to reach `infer`.
#
# Stack env vars (Portainer).  Required vars carry a ${VAR:?message} guard at
# their first use, so a missing one fails the deploy naming the variable —
# not with docker's bare "invalid reference format".
#   PROJECT        short project id, e.g. myproject
#   WORKBENCH_IMAGE  the fat agent workbench image (toolchains + the agent
#                  CLIs; docker/workbench).  Published by images.yml with
#                  the qwen version leading the tag: pin e.g.
#                  cloister-workbench:0.19.4-sha-<commit>, or track :latest.
#                  There is NO host workspace: the agent works in the
#                  grange volume the archivist provisions (docs/grange.md).
#   AGENT_CACHES   host dir for the agent's warmed dependency caches
#                  (gradle/go/cargo, via the airlock).  Per USER, shared
#                  across that user's projects; pre-create it owned by
#                  uid 1000.  Mounted at a CACHES subdir, never the whole
#                  home — a shared writable home would carry dotfiles
#                  (.bashrc, gradle init scripts) across cells, a
#                  cross-project persistence channel.  Interim-accepted
#                  as rw, like the builder's BUILD_HOME before it: the
#                  read-only content-addressed stores (grange.md "Stores,
#                  warming, and the airlock") are the planned successor.
#                  e.g. /srv/home/alice/.cloister-cache
#   WORKERS_IMAGE  e.g. cloister-workers:latest — the SLIM toolchain-free
#                  multi-call worker image (scratch + the static binary);
#                  every worker except the agent runs it
#   OPENAI_MODEL   (optional) the agency ENGINE CLASS the agent drives
#                  (default interactive-code); model tags live in the
#                  agency's routing policy, not in cells
#   STATE_TOKEN    shared worker<->state secret; per project, e.g. [guid]::NewGuid().ToString("N")
#   STATUS_BIND    (optional) host interface for the status pages; default
#                  127.0.0.1.  0.0.0.0 = LAN monitoring opt-in — see the
#                  exposure note on the status service before widening
#   STATUS_PORT    host port for the status pages (unique per project)
#   TZ             timezone for log timestamps AND the status pages, e.g.
#                  America/New_York (default UTC); applied to every container
#   KAGI_API_KEY   scholar's search/extract API token (Kagi). Set the account's
#                  custom billing limit LOW as a spend backstop.
#   SCHOLAR_POLICY host path of the read-only egress policy yaml (engine + deny list)
#   BRAVE_API_KEY  only if the policy sets search.engine: brave (else leave unset)
#   ARCHIVIST_ENDPOINTS host path of the archivist's endpoint table yaml
#                  (etc/endpoints.example.yaml is the template)
#   GITHUB_TOKEN_FILE host path of the bot-account token file the table's
#                  credentialFile points at (mounted read-only)
#
# The agent registers the archivist and scholar MCP servers in
# /home/agent/.qwen/settings.json (persisted in the qwen_home volume) and
# excludes the built-in web tools (web access MUST go through the scholar).
# The native file tools and shell are the agent's own now — it edits and
# builds directly in the grange (docs/grange.md M3/M4):
#   { "mcpServers": {
#       "archivist": { "httpUrl": "http://archivist:9600/mcp", "timeout": 5400000 },
#       "scholar":   { "httpUrl": "http://scholar:9500/mcp",   "timeout": 2400000 } } }
# (the archivist's 90 min exceeds await_review's 1 h maxWait cap.)
#
# Least-privilege network map (every edge is a network hop or token-gated API):
#   agent   ── infernet ────> agency        agent   ── archivistnet ─> archivist (MCP)
#   agent   ── researchnet ─> scholar (MCP)  scholar ── infernet ────> agency (model)
#   scholar ── scholarstate > state (audit)  scholar ── kagiegress ──> kagi-relay ── egress ─> kagi.com
#   archivist ─ statenet ───> state (remote + lifecycle audit); grange volume, NEVER a host tree
#   archivist ─ gitegress ──> github-relay ─ gitforward ─> github-egress ── egress ─> github.com (git, two-hop)
#   archivist ─ gitegress ──> github-api-relay ── egress ─> api.github.com (PR verbs, dialed by service name)
#   state   ── statepub ───> status relay    status  ── frontend ────> host publish
# So: all inference rides through the agency (raw `infer` sits behind it on the
# infra stack's private modelnet); the agent cannot reach state; the scholar
# handles untrusted web content and has NO route to the agent's workspace and NO
# `egress` net — only the pinned relays touch the internet.  The operator's host
# tree appears NOWHERE in this file: the cell's only workspace is the grange
# volume, cloned from the forge by the archivist and destroyed after the task.

# Single-source timezone: referenced by every container's environment so log
# timestamps (and the status pages) read in the operator's local zone.
# Defaults to UTC.  tzdata is embedded in the Go binary, so any IANA zone works.
x-tz: &tz "TZ=${TZ:-UTC}"

# Shared hardening for every socat relay (kagi + the git relays): the same
# unprivileged, read-only, capability-stripped shell.  Only `command`,
# `networks`, and `container_name` differ per relay — the load-bearing lines
# stay explicit at each site.
x-relay: &relay
  image: alpine/socat:1.8.0.3
  user: "65534:65534"                    # nobody
  restart: unless-stopped
  environment:
    - *tz
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  mem_limit: 64m

services:
  agent:
    # The workbench (docker/workbench): every toolchain under the agent
    # CLIs, working directly in the grange.  The ONLY service on a
    # toolchain-bearing image — the mediators (scribe, librarian,
    # builder) are retired (docs/grange.md M3/M4); the PR gate is the
    # boundary, and builds here are untrusted scratch work.
    image: ${REGISTRY:-ghcr.io/jeffbstewart}/${WORKBENCH_IMAGE:?set WORKBENCH_IMAGE, e.g. cloister-workbench:latest}
    container_name: ${PROJECT:?set PROJECT, the short project id}-agent
    user: "1000:1000"
    restart: unless-stopped
    # No entrypoint override: the image entrypoint registers the MCP
    # servers and materializes the stock prompt, then execs the image's
    # `sleep infinity` — the container idles; the operator starts agents
    # with `workbench` in an exec shell (tmux sessions survive it).
    environment:
      - *tz
      - OPENAI_BASE_URL=http://agency:11434/v1
      - OPENAI_API_KEY=ignored-for-local-use
      # The agency engine class the agent's session rides; the routing
      # policy (agency side) picks the node and model tag.
      - OPENAI_MODEL=${OPENAI_MODEL:-interactive-code}
      # The toolchains' caches ride the shared per-user AGENT_CACHES
      # bind below — cache content only; HOME itself is per-project.
      - GRADLE_USER_HOME=/home/agent/caches/gradle
      - GOMODCACHE=/home/agent/caches/go-mod
      - GOCACHE=/home/agent/caches/go-build
      - CARGO_HOME=/home/agent/caches/cargo
    volumes:
      # THE workspace: the grange ROOT, shared with the archivist that
      # provisions it.  tree/ (the checkout) appears at provision and
      # vanishes at dispose; the operator's host tree never enters.
      # The working_dir stays the ROOT — naming tree/ here would make
      # docker CREATE it at container start, which the archivist's
      # disk-derived state machine reads as CORRUPT; `workbench` drops
      # sessions into tree/ when it exists.
      - grange:/grange
      # The agent's HOME: a per-PROJECT volume, so dotfiles and shell
      # state never cross cells.  Only the caches subdir below is the
      # per-user shared surface.
      - agent_home:/home/agent
      # Warmed dependency caches, per user, shared across projects —
      # cache content only (the env below points the toolchains here),
      # never the home itself.
      - ${AGENT_CACHES:?set AGENT_CACHES, the agent's warmed dependency-cache dir on /srv (pre-create it uid-1000-owned), e.g. /srv/home/alice/.cloister-cache}:/home/agent/caches
      # qwen settings/history: its own per-project volume (predates
      # agent_home; kept separate so an agent_home reset preserves it).
      - qwen_home:/home/agent/.qwen
    working_dir: /grange
    read_only: true
    tmpfs:
      - /tmp:size=2g                     # build scratch (gradle/go/cargo temp)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    mem_limit: 8g                        # builds run here now (the builder's old budget)
    # Dead DNS upstream: every network below is internal, and on engines with
    # daemon-side DNS forwarding (CVE-2024-29018) name resolution alone
    # exfiltrates from an internal network.  127.0.0.1 black-holes the
    # embedded resolver's upstream; container names (agency, archivist, ...)
    # are answered authoritatively and never consult it.  compose-lint
    # requires this pin on every all-internal service; only the relays
    # (egress/frontend holders) keep real DNS.
    dns: 127.0.0.1
    networks:
      - infernet                         # reach the agency (shared infra stack)
      - archivistnet                     # reach the archivist MCP; NOT infer's peers
      - researchnet                      # reach the scholar MCP (research)

  state:
    image: ${REGISTRY:-ghcr.io/jeffbstewart}/${WORKERS_IMAGE}
    container_name: ${PROJECT}-state
    user: "1000:1000"                    # fixed service uid: state touches no workspace; its ledger stays in a Docker volume
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/state-service"]
    environment:
      - *tz
      - STATE_TOKEN=${STATE_TOKEN}
    volumes:
      - state:/state                     # rw: the SOLE owner of durable logs/audit/status
      # ro: the agency's status snapshot, for the dashboard's Inference
      # panel.  One-way glass by mount mode — status flows agency -> volume
      # -> here; no network edge exists (docs/agency.md).
      - agency_status:/agency-status:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/bin/state-service", "-healthcheck"]
      interval: 30s
    dns: 127.0.0.1                       # dead upstream — see the agent's dns note
    networks:
      - statenet                         # reachable by the archivist; internal -> no egress
      - scholarstate                     # reachable by the scholar (audit/approvals/transcripts)
      - statepub                         # reachable by the status relay only

  status:
    # The operator's web-based audit and approval endpoint: publishes the state
    # service's status pages (dashboard, audit tail, run logs, diffs) and the
    # /approvals page to localhost, via a relay that parses nothing.
    image: alpine/socat:1.8.0.3
    container_name: ${PROJECT}-status
    restart: unless-stopped
    user: "65534:65534"                  # nobody
    environment:
      - *tz
    command: ["TCP-LISTEN:9201,fork,reuseaddr", "TCP:state:9201"]
    ports:
      # Defaults to localhost-only.  STATUS_BIND=0.0.0.0 publishes the
      # status pages to the LAN — a deliberate operator opt-in for
      # monitoring a headless host from a dev machine.  What it exposes
      # to that network: the audit trail, run logs, stored diffs, and
      # the APPROVALS page (clickable decisions) — unauthenticated, per
      # the home-LAN threat model.  Never widen this on a network you
      # do not fully trust.
      - "${STATUS_BIND:-127.0.0.1}:${STATUS_PORT:-9201}:9201"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    networks:
      - statepub                         # reach state
      - frontend                         # publish to host; parses nothing

  scholar:
    image: ${REGISTRY:-ghcr.io/jeffbstewart}/${WORKERS_IMAGE}
    container_name: ${PROJECT}-scholar
    user: "1000:1000"
    restart: unless-stopped
    # The scholar role: a quarantined research service. Serves ONE MCP
    # tool research(query) on :9500 and internally drives a model (over the
    # agency's OpenAI API) with a FIXED three-tool menu (web_search / extract_url_as_markdown
    # / respond) whose only egress is Kagi via the kagi-relay. It handles UNTRUSTED
    # web content, so it holds no workspace of any kind, no route to the
    # agent or the archivist, and
    # no `egress` network — its sole internet path is the relay. On boot it
    # TCP-probes public IPs and refuses to start if any connect (fail-closed
    # self-check).
    entrypoint: ["/usr/local/bin/scholar"]
    command: ["-policy", "/etc/scholar/policy.yaml"]
    environment:
      - *tz
      - STATE_URL=http://state:9201
      - STATE_TOKEN=${STATE_TOKEN}
      # No model name: the scholar asks the agency for its `research`
      # engine class by name.
      - OPENAI_BASE_URL=http://agency:11434/v1
      - OPENAI_API_KEY=ignored-for-local-use
      - KAGI_API_KEY=${KAGI_API_KEY:?set KAGI_API_KEY, the scholar search/extract token}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}       # only if the policy sets search.engine: brave
      - KAGI_RELAY_ADDR=kagi-relay:8443        # dialed instead of kagi.com; TLS SNI stays kagi.com
    volumes:
      - ${SCHOLAR_POLICY:?set SCHOLAR_POLICY to the host path of the egress policy yaml}:/etc/scholar/policy.yaml:ro   # read-only egress policy
      - scholar_burn:/burn                              # tiny writable burn ledger: timestamps only
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/bin/scholar", "-healthcheck"]
      interval: 30s
    # Dead upstream (see the agent's dns note); the scholar's boot
    # self-check probes this independently of the TCP route.
    dns: 127.0.0.1
    networks:
      - researchnet                      # reachable by the agent ONLY (inbound MCP)
      - infernet                         # reach the model (via the agency); internal -> no internet
      - scholarstate                     # reach state (audit + approvals + transcripts).
                                         # NOT statenet: keeps the scholar off the archivist's wire
      - kagiegress                       # to the kagi-relay ONLY (internal; no internet)

  archivist:
    image: ${REGISTRY:-ghcr.io/jeffbstewart}/${WORKERS_IMAGE}
    container_name: ${PROJECT}-archivist
    # Fixed image uid: the workspace here is the grange named volume —
    # image-initialized and owned by the image's worker uid (1000, the
    # same uid the agent runs as) — never the operator's host tree.
    user: "1000:1000"
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/archivist"]
    environment:
      - *tz
      - STATE_URL=http://state:9201
      - STATE_TOKEN=${STATE_TOKEN}
    volumes:
      # A dedicated grange volume, NEVER a host bind — the operator's host
      # tree does not enter the archivist (docs/archivist.md).  The volume
      # is the grange ROOT: the archivist manages tree/ (the exported
      # checkout) and staging/ (the pre-promote clone) under it, so the
      # promote can be an atomic rename.
      - grange:/grange
      - ${ARCHIVIST_ENDPOINTS:?set ARCHIVIST_ENDPOINTS to the host path of the endpoint table yaml}:/etc/cloister/endpoints.yaml:ro
      - ${GITHUB_TOKEN_FILE:?set GITHUB_TOKEN_FILE to the host path of the bot token file}:/run/secrets/github-token:ro
    working_dir: /grange
    read_only: true
    tmpfs:
      - /tmp                             # the runner's empty hooks dir lives here
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/usr/local/bin/archivist", "-healthcheck"]
      interval: 30s
    dns: 127.0.0.1                       # dead upstream — the git relays are its only routes out
    networks:
      - archivistnet                     # reachable by the agent (inbound MCP)
      - statenet                         # remote-op audit to state
      - gitegress                        # to the git relays ONLY (internal)

  kagi-relay:
    <<: *relay
    container_name: ${PROJECT}-kagi-relay
    # Hard-wired to Kagi: the scholar dials kagi-relay:8443, socat forwards raw
    # TCP to kagi.com:443. TLS stays end-to-end (the relay pipes ciphertext);
    # `fork` re-resolves per connection so Kagi CDN rotation is handled.
    command: ["TCP-LISTEN:8443,fork,reuseaddr", "TCP:kagi.com:443"]
    networks:
      - kagiegress                       # reachable by the scholar
      - egress                           # with the git egress hop, the only containers touching the internet

  # The git jail's egress is a TWO-HOP path, so no container both HOLDS the
  # `github.com` alias and RESOLVES it: the front carries the alias the
  # archivist's git dials (needed for end-to-end TLS — git verifies the real
  # cert against the dialed name), and pipes to a separately-named egress hop
  # that resolves the real github.com (it is on no network that aliases the
  # name, so there is no self-referential loop).  Unprivileged :443 binds
  # under Docker's default ip_unprivileged_port_start=0.
  github-relay:
    <<: *relay
    container_name: ${PROJECT}-github-relay
    command: ["TCP-LISTEN:443,fork,reuseaddr", "TCP:github-egress:443"]
    dns: 127.0.0.1                       # internal-only front; resolves github-egress via the embedded resolver, nothing external
    networks:
      gitegress:
        aliases: [github.com]            # the archivist dials this; TLS verifies github.com
      gitforward: {}                     # to the egress hop (no internet here)

  github-egress:
    <<: *relay
    container_name: ${PROJECT}-github-egress
    command: ["TCP-LISTEN:443,fork,reuseaddr", "TCP:github.com:443"]
    networks:
      gitforward: {}                     # reachable by github-relay
      egress: {}                         # resolves + reaches the real github.com

  # The PR verbs' door.  The archivist's Go client dials this by SERVICE
  # NAME (github-api-relay) while presenting SNI api.github.com, so — unlike
  # git — the API host needs no alias, and this single relay resolves the
  # real api.github.com with no loop.
  github-api-relay:
    <<: *relay
    container_name: ${PROJECT}-github-api-relay
    command: ["TCP-LISTEN:443,fork,reuseaddr", "TCP:api.github.com:443"]
    networks:
      - gitegress                        # reachable by the archivist (by service name)
      - egress                           # resolves + reaches the real api.github.com

networks:
  infernet:
    external: true                       # shared infra stack's inference net
    name: infernet
  archivistnet:
    internal: true                       # agent <-> archivist (MCP)
  statenet:
    internal: true                       # archivist <-> state
  scholarstate:
    internal: true                       # scholar <-> state ONLY (not the archivist's wire)
  statepub:
    internal: true                       # state <-> relay
  researchnet:
    internal: true                       # agent <-> scholar
  kagiegress:
    internal: true                       # scholar <-> kagi-relay (no internet)
  gitegress:
    internal: true                       # archivist <-> git relays (no internet)
  gitforward:
    internal: true                       # github-relay <-> github-egress (no internet)
  egress: {}                             # relays -> internet (ONLY egress-holding relays)
  frontend: {}                           # relay's host-publish path

volumes:
  qwen_home:
  agent_home:
    name: ${PROJECT}_agent_home          # per-project HOME: dotfiles never cross cells
  # The agent's dependency caches (AGENT_HOME) are a USER-OWNED /srv
  # bind, not a named volume — per user, shared across that user's
  # projects.  The fixed-uid state service and the agent/scholar keep
  # named volumes.
  state:
    # The volume NAME keeps its historical "builder_state" — renaming a
    # deployed volume would orphan the cell's durable ledger.
    name: ${PROJECT}_builder_state
  scholar_burn:
    name: ${PROJECT}_scholar_burn
  grange:
    name: ${PROJECT}_grange              # the archivist's workspace; provision fills it, dispose empties it
  agency_status:
    external: true                       # created by the shared inference stack
    name: agency_status                  # (deploy it first), like infernet
