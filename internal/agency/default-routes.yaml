# Agency engine-class routing — the EMBEDDED DEFAULT (docs/agency.md).
# Compiled into the worker binary (go:embed) and used whenever no
# -config flag and no AGENCY_ROUTES env override is given, so the image
# routes sensibly out of the box.  The class name constants in config.go
# mirror this vocabulary; a test holds them in sync.
#
# This is the class vocabulary consumers program against: a consumer puts a
# CLASS name in the request's `model` field and never learns which node or
# model tag serves it.  The heavy chains lead with the sometimes-there
# deep-think node and fall back to the always-there GPU node; presence
# probes skip the node while it is away, so no consumer ever notices the
# MacBook leaving.  (Names with no consumer yet — summarize-cheap, review —
# are declared now so the vocabulary is stable before their workers land.)
#
# To override on a host: point the AGENCY_ROUTES env at a mounted copy —
# that file replaces this one entirely.  Secrets and LAN addresses belong
# only in such an operator copy, never here — which is why the deep-think
# node appears as its in-stack relay name, not an address: the real LAN
# target rides the DEEPTHINK_ADDR stack var (docker/inference.yaml).

probe:
  interval: 15s
  timeout: 3s

nodes:
  infer:
    url: http://infer:11434
    # One admission at a time: with a ~19 GB model and 32k context on a
    # 24 GB GPU, ollama effectively runs one slot, and any extra request
    # the door admits would just sit in ollama's blind FIFO — invisible to
    # the two-class queue, where interactive must overtake batch.  Keep
    # the queueing at the door.
    maxInFlight: 1
    models:
      - qwen3-coder:30b
  deepthink:
    # The deep-think node (docs/deepthink.md): a jailed macOS ollama on a
    # 128 GiB MacBook, dialed through the inference stack's blind
    # deepthink-relay so no LAN address lives here.  Sometimes-there by
    # design — every chain leading here falls back to `infer`.
    #
    # deepthink.internal is the relay's network alias, not its service
    # name: a loopback-bound ollama 403s Host headers outside its
    # DNS-rebinding allowlist, which admits `.internal` names but not a
    # bare `deepthink-relay`.  The blind relays pass the Host header
    # through untouched, so the name we dial is the name the node judges.
    url: http://deepthink.internal:11434
    # One admission across both residents: decode speed is bound by the
    # unified memory's bandwidth, which a single request already
    # saturates — a second wouldn't add throughput, just slow both.
    maxInFlight: 1
    models:
      # The heavy lane: a large MoE — few active parameters keep decode
      # fast even when chain-of-thought multiplies the tokens.
      - qwen3-coder-next:latest
      # The fast lane: a mid-size reasoning model resident alongside.
      - qwen3.6-27b:latest

classes:
  # The agent's own session — the human is watching the tokens arrive.
  interactive-code:
    priority: interactive
    deadline: 5m
    maxDeadline: 15m
    queueWait: 20s
    maxQueueWait: 2m
    chain:
      - node: infer
        model: qwen3-coder:30b

  # The librarian's quick comprehension pass (infer.Quick — its provenance
  # name for this class).  Serves the agent mid-turn: short and interactive.
  # Leads with the deep-think node's fast lane; a busy or absent node means
  # the local GPU within the queueWait.
  think-fast:
    priority: interactive
    deadline: 90s
    maxDeadline: 5m
    queueWait: 15s
    maxQueueWait: 1m
    chain:
      - node: deepthink
        model: qwen3.6-27b:latest
      - node: infer
        model: qwen3-coder:30b

  # The librarian's effortful chain-of-thought pass (infer.Thorough), led
  # by the heavy-MoE lane on the deep-think node — the work the local GPU
  # cannot hold well — degrading to it when the node is away.
  deep-think:
    priority: interactive
    deadline: 5m
    maxDeadline: 15m
    queueWait: 30s
    maxQueueWait: 5m
    chain:
      - node: deepthink
        model: qwen3-coder-next:latest
      - node: infer
        model: qwen3-coder:30b

  # The scholar's research loop: search-grounded synthesis while the agent
  # (and usually the human) waits on the answer.
  research:
    priority: interactive
    deadline: 5m
    maxDeadline: 10m
    queueWait: 30s
    maxQueueWait: 2m
    chain:
      - node: infer
        model: qwen3-coder:30b

  # Background digestion — summaries, indexing.  Batch: it waits its turn
  # whenever anything interactive is queued.
  summarize-cheap:
    priority: batch
    deadline: 2m
    maxDeadline: 10m
    queueWait: 1m
    maxQueueWait: 10m
    chain:
      - node: infer
        model: qwen3-coder:30b

  # The corrector's review lenses (docs/corrector.md): long-running,
  # never blocks a human — advice can wait behind every interactive ask.
  # The prime deep-think workload: batch tolerance means it can afford to
  # queue for the strong model.
  review:
    priority: batch
    deadline: 10m
    maxDeadline: 30m
    queueWait: 5m
    maxQueueWait: 30m
    chain:
      - node: deepthink
        model: qwen3-coder-next:latest
      - node: infer
        model: qwen3-coder:30b
