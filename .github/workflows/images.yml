name: images

# The authoritative image pipeline: on every push to main and on version
# tags, cross-compile the two static binaries — cloister-worker (every
# worker role) and the workbench session manager — then build and push
# the slim workers image and the fat agent workbench (toolchains + the
# agent CLI + the session manager; docker/workbench) to GHCR.  Tags carry
# the worker binary as a GitHub Release asset.
#
# Distribution note: the workbench image redistributes Amazon Corretto
# (GPLv2 with the Classpath Exception); see THIRD_PARTY_NOTICES for the
# corresponding-source pointer that obligation rides on.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write # attach the release binary (tags only)
  packages: write # push images to GHCR

env:
  WORKERS_IMAGE: ghcr.io/jeffbstewart/cloister-workers
  # Pins the qwen-code CLI inside the workbench image.  Bump
  # deliberately; the Dockerfile default matches.
  QWEN_VERSION: "0.19.4"
  WORKBENCH_IMAGE: ghcr.io/jeffbstewart/cloister-workbench
  # The jailed-claude variant (docs/JAILED_CLAUDE.md).  THIS PACKAGE MUST
  # STAY PRIVATE: claude-code is "all rights reserved", so publishing an
  # image containing it is redistribution.  The RECIPE
  # (docker/workbench-claude/Dockerfile) is public and that is fine —
  # naming a package someone installs themselves under their own licence
  # has never been distribution, and Anthropic publishes its own
  # containerization recipe in that same public repo.  GHCR packages are
  # created private; do not promote this one.
  WORKBENCH_CLAUDE_IMAGE: ghcr.io/jeffbstewart/cloister-workbench-claude
  # Pins the Claude Code CLI inside that variant.  The Dockerfile default
  # matches.  Findings in docs/JAILED_CLAUDE.md are VERSION-SCOPED — re-run
  # lifecycle/probe-claude-harness.sh when this moves.
  CLAUDE_VERSION: "2.1.222"
  # The retired cloister-agent and cloister-builder-jvm images are no
  # longer published (the grange cutover, docs/grange.md): the workbench
  # replaced both.  Their contexts leave the tree with the corpse
  # removal.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Every published artifact carries the same version: the semver tag
      # when this run is a tag, else the short commit SHA.
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the static cloister-worker binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o docker/workers/cloister-worker ./cmd/cloister-worker

      # The workbench session manager: the operator's door into a cell,
      # and the only thing that can provision or dispose now that those
      # verbs left the agent's MCP surface (docs/archivist.md, "Two
      # surfaces").  Static, into the workbench image's build context.
      - name: Build the static workbench session manager
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o docker/workbench/cloister-workbench ./cmd/workbench

      # The git proxy, installed as `git` in the agent image: reads pass
      # to the real binary, ref-moving commands translate to archivist
      # verbs, the rest refuse (docs/git-proxy.md).
      - name: Build the static git proxy
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o docker/workbench/cloister-git-proxy ./cmd/git-proxy

      # Buildx now so the platform list below is the only thing to touch
      # when arm64 joins (a Mac-hosted scholar, a D20 cell).
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The workbench tag leads with the qwen-code version it jails
      # (0.19.4-sha-abc… / 0.19.4-1.0.0): the commit part plays a
      # recipe-revision role, so any recipe change yields a fresh tag and a
      # pinned pull can never go stale.  Deliberately NO bare :0.19.4
      # rolling tag — that would reintroduce the ambiguity the rev killed.
      - name: Image tags
        id: tags
        run: |
          V="${{ steps.ver.outputs.version }}"
          WORKERS="${WORKERS_IMAGE}:${V}"
          WORKBENCH="${WORKBENCH_IMAGE}:${QWEN_VERSION}-${V}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
            WORKERS="${WORKERS},${WORKERS_IMAGE}:latest"
            WORKBENCH="${WORKBENCH},${WORKBENCH_IMAGE}:latest"
          fi
          echo "workers=${WORKERS}" >> "$GITHUB_OUTPUT"
          echo "workbench=${WORKBENCH}" >> "$GITHUB_OUTPUT"

      - name: Build and push the workers image
        uses: docker/build-push-action@v6
        with:
          context: docker/workers
          push: true
          platforms: linux/amd64 # add linux/arm64 here when needed
          tags: ${{ steps.tags.outputs.workers }}

      # The fat agent workbench (docs/grange.md M4): toolchains + the
      # agent CLI in one image; the tag leads with the qwen CLI version.
      - name: Build and push the workbench image
        uses: docker/build-push-action@v6
        with:
          context: docker/workbench
          push: true
          platforms: linux/amd64 # add linux/arm64 here when needed
          build-args: |
            QWEN_CLI_VERSION=${{ env.QWEN_VERSION }}
          tags: ${{ steps.tags.outputs.workbench }}

      # --- the jailed-claude variant (docs/JAILED_CLAUDE.md) ---------------
      # A thin layer on the image just pushed, so both CLIs share one set of
      # toolchains, one git proxy, and above all ONE environment prompt.
      # That sharing is the hedge: the qwen path cannot rot unnoticed if it
      # is the same path.
      #
      # The CA certificate is what makes the cell's trust store hold exactly
      # one issuer, and it is operator-specific — so it comes from a repo
      # VARIABLE rather than the tree.  A variable, not a secret: it is a
      # public certificate, and putting it in `vars` keeps it out of a public
      # tree without pretending it is confidential.  The CA PRIVATE key is
      # never here, and never in any image; see "The CA" in the design.
      - name: Materialize the cloister CA certificate
        id: ca
        env:
          CLOISTER_CA_PEM: ${{ vars.CLOISTER_CA_PEM }}
        run: |
          if [ -z "${CLOISTER_CA_PEM}" ]; then
            echo "::notice::vars.CLOISTER_CA_PEM is unset — skipping the claude variant."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${CLOISTER_CA_PEM}" > docker/workbench-claude/cloister-ca.crt
          # Fail here rather than produce an image whose trust store is
          # quietly wrong: the Dockerfile's own count check would catch an
          # empty file, but a malformed one that happens to contain the
          # marker string would slip through to a confusing TLS failure in
          # the cell.
          openssl x509 -in docker/workbench-claude/cloister-ca.crt -noout -subject
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build and push the claude workbench variant
        if: steps.ca.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/workbench-claude
          push: true
          platforms: linux/amd64
          build-args: |
            WORKBENCH_IMAGE=${{ env.WORKBENCH_IMAGE }}:${{ env.QWEN_VERSION }}-${{ steps.ver.outputs.version }}
            CLAUDE_CLI_VERSION=${{ env.CLAUDE_VERSION }}
          # The tag leads with the CLAUDE version, mirroring how the stock
          # workbench leads with qwen's.  No rolling :latest — this image
          # carries a proprietary CLI whose version scopes every finding in
          # docs/JAILED_CLAUDE.md, so a pull must never be ambiguous about
          # which one it got.
          tags: ${{ env.WORKBENCH_CLAUDE_IMAGE }}:${{ env.CLAUDE_VERSION }}-${{ steps.ver.outputs.version }}

      # Tags get a GitHub Release carrying the static binary, so a cell can
      # run the sidecar without pulling an image at all.
      - name: Create the release with the binary attached
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp docker/workers/cloister-worker cloister-worker-linux-amd64
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "cloister-worker-linux-amd64#cloister-worker ${GITHUB_REF_NAME} (linux/amd64, static)"
